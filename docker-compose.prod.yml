services:
  db:
    image: postgres:16
    command: -p ${DB_PORT}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Loopback only, lets host-native processes (e.g. Netdata) connect without depending on the container's internal bridge IP staying stable.
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -p ${DB_PORT}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      args:
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    # Loopback only, reached via the Cloudflare Tunnel, not public.
    ports:
      - "127.0.0.1:${WEB_PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      DEBUG: ${DEBUG}
      PORT: ${PORT}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
    restart: unless-stopped

volumes:
  pgdata:
